name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group dev
      - name: Check for syntax errors, undefined names and unused variables
        run: uv run ruff check src tests --select E9,F821,F823,F841

  test:
    name: Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group dev
      - name: Use the example settings
        run: cp .env.example .env
      - name: Run tests
        run: uv run pytest -q
