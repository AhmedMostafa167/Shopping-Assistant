services:
  pgvector: 
    image: pgvector/pgvector:0.8.5-pg18-trixie
    container_name: pgvector
    ports: 
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - backend

networks:
  backend:

volumes:
  pgvector_data: