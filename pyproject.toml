[project]
name = "shopping-assistant"
version = "0.1.0"
description = "a shopping assistant over Amazon products"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.137.2",
    "langgraph>=1.2.10",
    "langchain-cohere>=0.5.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "structlog>=25.4.0",
    "uvicorn>=0.49.0",
    "prometheus-client>=0.26.0",
    "starlette-exporter>=0.24.0",
    "fastapi-health>=0.4.0",
    "nltk>=3.10.0",
    "pandas>=3.0.3",
    "pyarrow==25.0.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "datasets>=5.0.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
